    CreateProductRequest:
      type: object
      description: Payload to create a storefront product.
      properties:
        name:
          type: string
          description: Product name.
          example: Chari T-shirt
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Optional long description.
          example: 100% cotton, unisex.
          maxLength: 2000
          minLength: 0
        imageUrl:
          type: string
          description: Optional product image URL.
          example: https://cdn.example.com/tshirt.png
          maxLength: 2000
          minLength: 0
        price:
          type: number
          description: Unit price in MAD major units.
          example: 199
        currency:
          type: string
          description: ISO-4217 currency; defaults to MAD.
          example: MAD
          maxLength: 3
          minLength: 0
        stockQuantity:
          type: integer
          format: int32
          description: Optional stock to track; unlimited when omitted.
          example: 100
        expiresAt:
          type: string
          format: date-time
          description: Optional sale-ends timestamp (ISO-8601 UTC), must be in the future.
          example: 2026-12-31T23:59:59Z
        externalId:
          type: string
          description: Optional client-supplied id, unique per merchant. Creating a
            product with an externalId that already exists returns the existing
            product (idempotent replay).
          example: sku-tshirt-blue-m
          maxLength: 255
          minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Optional free-form metadata object, echoed back on reads and in the
