    CheckoutSessionConfig:
      type: object
      description: Buyer, redirect URLs and options for the checkout.
      properties:
        customer:
          $ref: "#/components/schemas/CheckoutSessionCustomer"
        urls:
          $ref: "#/components/schemas/CheckoutSessionUrls"
          description: Optional redirect / notification URLs. Any field left unset falls
            back to the merchant's configured default, then the platform
            default.
        keepAlive:
          type: boolean
          description: Keep the session alive after a failed attempt so the buyer can
            retry. Defaults to false.
          example: false
        frontend:
          $ref: "#/components/schemas/CheckoutSessionFrontend"
        settlement:
          $ref: "#/components/schemas/CheckoutSessionSettlement"
      required:
        - customer
    CheckoutSessionCustomer:
      type: object
      description: The buyer being charged.
      properties:
        email:
          type: string
          description: Buyer e-mail.
          example: buyer@example.com
        phone:
          type: string
          description: Buyer phone (E.164).
          example: "+212600000000"
        firstName:
          type: string
          description: Buyer first name.
          example: Amine
        lastName:
          type: string
          description: Buyer last name.
          example: Bennani
        phoneClient:
          type: string
          description: Optional secondary phone.
          example: "+212611111111"
      required:
        - email
        - firstName
        - lastName
        - phone
    CheckoutSessionFrontend:
      type: object
      description: Optional branding for the hosted checkout page.
      properties:
        theme:
          type: string
          description: Theme name.
          example: light
        logo:
          type: string
          description: Logo URL.
          example: https://cdn.example.com/logo.png
        companyName:
          type: string
          description: Company name shown on checkout.
          example: Acme SARL
    CheckoutSessionSettlement:
      type: object
      description: Optional distribution — sub-merchant wallet to credit.
      properties:
        walletId:
          type: string
          format: uuid
          description: Destination sub-merchant wallet id.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        subMerchantReference:
          type: string
          description: Destination sub-merchant reference.
          example: subm_9Zt2Bc
    CheckoutSessionUrls:
      type: object
      description: Redirect and webhook URLs (all https://, all optional).
      properties:
        accept:
          type: string
          description: Success redirect (https://). Falls back to merchant, then platform,
            default.
          example: https://merchant.example.com/success
          pattern: ^https://\S+$
        decline:
          type: string
          description: Failure redirect (https://). Falls back to merchant, then platform,
            default.
          example: https://merchant.example.com/cancel
          pattern: ^https://\S+$
        notification:
          type: string
          description: Per-session webhook target (https://). Falls back to the merchant
            default.
          example: https://merchant.example.com/webhooks/charipay
          pattern: ^https://\S+$
        externalReference:
          type: string
          description: Merchant business key echoed as ExternalId in webhooks. Defaults to
            orderId.
          example: ORD-2026-0001
    CreateCheckoutSessionRequest:
      type: object
      description: Payload to create a one-shot hosted checkout session.
      properties:
        amount:
          type: number
          description: Amount to collect, in MAD major units.
          example: 250
        orderId:
          type: string
          description: Your order/business reference for this checkout.
          example: ORD-2026-0001
        singleUse:
          type: boolean
          description: Single-use session (recommended). Defaults to true.
          example: true
        externalId:
          type: string
          description: Optional client-supplied id, unique per merchant; a duplicate value
            replays the existing session. Distinct from
            orderId/externalReference, which are not uniqueness-enforced.
          example: order-1234
        config:
          $ref: "#/components/schemas/CheckoutSessionConfig"
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Free-form metadata object (≤ 4 KB) echoed back in the payment
            webhook.
          example:
            cartId: c_987
            source: web
        expiresAt:
          type: string
          format: date-time
          description: Session expiry (ISO-8601 UTC). Must be in the future; defaults to
            72h after creation.
          example: 2026-08-03T10:00:00Z
        notifyOnFailure:
          type: boolean
          description: Also send a payment.failed webhook when the payment fails. Defaults
            to false.
          example: false
      required:
        - amount
        - config
        - orderId
