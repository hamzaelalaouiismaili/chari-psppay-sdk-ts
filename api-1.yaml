        sessionId:
          type: string
          description: Unique payment-session identifier.
          example: ps_5Kd0Rn
        sessionToken:
          type: string
          description: Server-side session token.
          example: st_live_9f3c…
        verifyKey:
          type: string
          description: Single-use verify key passed as the vk URL parameter.
          example: vk_5Kd0Rn
        expiresAt:
          type: string
          format: date-time
          description: Session expiry timestamp.
          example: 2026-07-31T10:15:00Z
        checkoutUrl:
          type: string
          description: Hosted checkout page URL.
          example: https://pay.chari.ma/checkout/ps_5Kd0Rn
    SendPaymentLinkRequest:
      type: object
      description: Optional override recipient for the link e-mail.
      properties:
        email:
          type: string
          description: Recipient e-mail; falls back to the link's stored customer e-mail
            when omitted.
          example: buyer@example.com
    CreatePaymentLinkRequest:
      type: object
      description: Payload to create a reusable payment link.
      properties:
        amount:
          type: number
          description: Amount to collect, in MAD major units.
          example: 149.9
        description:
          type: string
          description: Short description shown to the buyer.
          example: "Order #1234"
          maxLength: 255
          minLength: 0
        singleUse:
          type: boolean
          description: true = link is consumed after one successful payment; false =
            reusable. Defaults to true.
          example: false
        paymentMethod:
          type: string
          description: Default method shown on the hosted checkout. Defaults to CARD.
          enum:
            - CARD
            - CASH
          example: CARD
        customerName:
          type: string
          description: Optional buyer name.
          example: Amine Bennani
          maxLength: 255
          minLength: 0
        customerEmail:
          type: string
          description: Optional buyer e-mail.
          example: buyer@example.com
          maxLength: 255
          minLength: 0
        customerPhone:
          type: string
          description: Optional buyer phone (E.164).
          example: "+212600000000"
          maxLength: 30
          minLength: 0
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry (ISO-8601 UTC). Must be in the future.
          example: 2026-12-31T23:59:59Z
        acceptUrl:
          type: string
          description: Buyer is redirected here after a successful payment (https:// only).
          example: https://merchant.example.com/success
          maxLength: 2048
          minLength: 0
          pattern: ^https://\S+$
        declineUrl:
          type: string
          description: Buyer is redirected here after a failed/declined payment (https://
            only).
          example: https://merchant.example.com/cancel
          maxLength: 2048
          minLength: 0
          pattern: ^https://\S+$
        notificationUrl:
          type: string
          description: Per-link webhook target (https:// only), in addition to registered
            endpoints.
          example: https://merchant.example.com/webhooks/charipay
          maxLength: 2048
          minLength: 0
          pattern: ^https://\S+$
        externalId:
          type: string
          description: Optional client-supplied id, unique per merchant. Creating a link
            with an externalId that already exists returns the existing link
            (idempotent replay).
          example: order-1234
          maxLength: 255
          minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Optional free-form metadata object, echoed back on reads and in the
            payment webhook when the link is paid.
          example:
            cartId: c_987
      required:
        - amount
        - description
    WebhookEndpointRequest:
      type: object
      description: Create or update a signed outbound webhook endpoint.
      properties:
        url:
          type: string
          description: Public HTTPS receiver URL on port 443. Private, loopback,
            link-local and non-HTTPS targets are rejected.
          example: https://merchant.example.com/webhooks/charipay
          maxLength: 2000
          minLength: 0
        description:
          type: string
          description: Merchant-facing endpoint label.
          example: Production billing events
          maxLength: 500
          minLength: 0
        enabledEvents:
          type: array
          description: Explicit event allowlist. Null or empty subscribes to every current
            and future event; an explicit list is recommended for stable
            integrations.
          example:
            - payment.succeeded
            - subscription.payment_succeeded
            - subscription.payment_failed
          items:
            type: string
            description: Webhook event name used in enabledEvents and the Chari-Event-Type
              delivery header. The public-v1 guide identifies which names are
              currently emitted and which are reserved for future products.
            enum:
              - payment_link.created
              - payment_link.updated
              - payment_link.expired
              - payment_link.cancelled
              - payment.initiated
              - payment.requires_action
              - payment.succeeded
              - payment.failed
              - subscription.payment_succeeded
              - subscription.payment_failed
              - subscription.canceled
              - refund.initiated
              - refund.succeeded
              - refund.failed
              - security.token_reused
              - security.rate_limit_exceeded
              - security.invalid_signature
              - wallet.activated
              - wallet.rejected
              - payout.completed
              - payout.failed
              - submerchant.near_cap
              - wallet.funded
              - wallet.transfer_completed
              - merchant_transfer.completed
              - merchant_transfer.failed
              - topup.pending
              - topup.succeeded
              - topup.failed
              - topup.reversed
              - bill_payment.pending
              - bill_payment.succeeded
              - bill_payment.failed
              - bill_payment.reversed
              - voucher.issued
              - voucher.failed
              - voucher.redeemed
              - voucher.expired
              - savings.deposit_succeeded
              - savings.withdrawal_succeeded
              - savings.instruction_failed
              - savings.goal_reached
              - order.paid
              - cash_collection.deposit.completed
          uniqueItems: true
        customHeaders:
          type: object
          additionalProperties:
            type: string
          description: Optional static routing headers. Host, Authorization, Cookie,
            Chari-* and X-CHARI-* cannot be overridden.
          example:
            X-Tenant: acme
        apiVersion:
          type: string
          description: Webhook payload contract version.
          example: 2024-01-01
          maxLength: 20
          minLength: 0
        enabled:
          type: boolean
          description: Whether delivery starts immediately.
          example: true
        environment:
          type: string
          description: SANDBOX or PRODUCTION. Portal routes only — defaults to PRODUCTION
            when omitted. Ignored on /api/v1/partner/** where the API key
            decides, and ignored on update (an endpoint cannot move between
            environments; delete and re-create instead).
          enum:
            - SANDBOX
            - PRODUCTION
          example: SANDBOX
      required:
        - url
    WebhookEndpointResponse:
      type: object
      description: Registered signed webhook endpoint and delivery health.
      properties:
        id:
          type: string
          format: uuid
          description: Endpoint identifier used for reads, updates, rotation and deletion.
        object:
          type: string
        environment:
          type: string
          description: Environment this endpoint belongs to. Only events of the same
            environment are delivered to it.
          enum:
            - SANDBOX
            - PRODUCTION
          example: SANDBOX
        url:
          type: string
          description: Public HTTPS delivery URL.
        description:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
            - SUSPENDED
        apiVersion:
          type: string
        signingSecret:
          type: string
          description: HMAC secret returned only on endpoint creation or rotation. Store
            it immediately.
          example: whsec_...
          readOnly: true
        enabledEvents:
          type: array
          description: Canonical Chari-Event-Type values delivered to this endpoint.
          items:
            type: string
          uniqueItems: true
        previousSecretExpiresAt:
          type: string
          format: date-time
          description: "While set, the previous signing secret still verifies and
            deliveries carry both signatures: X-CHARI-SIGNATURE (old) and
            X-CHARI-SIGNATURE-NEXT (new)."
        customHeaders:
          type: object
          additionalProperties:
            type: string
          description: Static non-reserved routing headers added to deliveries.
        consecutiveFailures:
          type: integer
          format: int32
          description: Failed attempts since the last success; resets on any 2xx.
        suspendedAt:
          type: string
          format: date-time
          description: When the endpoint was auto-suspended, if it is SUSPENDED.
        totalDeliveries:
          type: integer
          format: int64
        successfulDeliveries:
          type: integer
          format: int64
        failedDeliveries:
          type: integer
          format: int64
        successRate:
          type: number
          format: double
        lastDeliveryAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        lastFailureAt:
          type: string
          format: date-time
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        livemode:
          type: boolean
          description: True for a production-key endpoint; false for sandbox.
    CreateClientRequest:
      type: object
      description: Payload to create a reusable customer (client) record.
      properties:
        name:
          type: string
          description: Client full name.
          example: Amine Bennani
          maxLength: 255
          minLength: 0
        email:
          type: string
          description: Optional client e-mail.
          example: amine@example.com
          maxLength: 255
          minLength: 0
        phone:
          type: string
          description: Optional client phone (E.164).
          example: "+212600000000"
          maxLength: 30
          minLength: 0
      required:
        - name
    ClientResponse:
      type: object
      description: Merchant-facing view of a client (payer).
      properties:
        id:
          type: string
          format: uuid
          description: Unique client identifier.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          description: Client full name.
          example: Amine Bennani
        email:
          type: string
          description: Client email address.
          example: amine@example.com
        phone:
          type: string
          description: Client phone number.
          example: "+212600000000"
        origin:
          type: string
          description: How the record was created (API or DASHBOARD).
          enum:
            - API
            - DASHBOARD
          example: API
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: 2026-07-31T10:15:00Z
    UpdateProductRequest:
      type: object
      description: Partial-update body for a product. Only the fields present are changed.
      properties:
        name:
          type: string
          description: Product name. Optional; only applied when present.
          example: Chari T-shirt
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Product description. Optional; only applied when present.
          example: Premium cotton T-shirt
          maxLength: 2000
          minLength: 0
        imageUrl:
          type: string
          description: Product image URL. Optional; only applied when present.
          example: https://ecom.chari.ma/img/prod_2Bc9Zt.png
          maxLength: 2000
          minLength: 0
        price:
          type: number
          description: Unit price. Optional; only applied when present.
          example: 149.9
        active:
          type: boolean
          description: Whether the product is active. Optional; only applied when present.
          example: true
        stockQuantity:
          type: integer
          format: int32
          description: Total stock quantity. Optional; only applied when present.
          example: 100
        expiresAt:
          type: string
          format: date-time
          description: Expiry timestamp of the listing. Optional; only applied when present.
          example: 2026-07-31T10:15:00Z
        clearExpiration:
          type: boolean
          description: Set to true to clear the existing expiration. Optional; only
            applied when present.
          example: false
    PublicPaymentStatusResponse:
      type: object
      properties:
        reference:
          type: string
        type:
          type: string
        status:
          type: string
        amount:
          type: number
        currency:
          type: string
        paid:
          type: boolean
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageWebhookEventResponse:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventResponse"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        unpaged:
          type: boolean
        paged:
          type: boolean
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
    SortObject:
      type: object
      properties:
        unsorted:
          type: boolean
        sorted:
          type: boolean
        empty:
          type: boolean
    WebhookEventResponse:
      type: object
      description: An emitted webhook event and its delivery state.
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
          description: Delivery record identifier — pass this to the replay endpoint.
        eventId:
          type: string
          format: uuid
          description: Idempotency key sent as the Chari-Event-Id header and body
            WebhookEventId.
        eventType:
          type: string
          description: Canonical event name, same value as the Chari-Event-Type header.
          example: payment.succeeded
        endpointId:
          type: string
          format: uuid
          description: Endpoint this event was delivered to.
        status:
          type: string
          enum:
            - pending
            - sending
            - delivered
            - failed
            - retrying
            - exhausted
            - skipped
        resourceType:
          type: string
          description: Business object the event is about.
          example: payment_operation
        resourceId:
          type: string
          format: uuid
        paymentLinkId:
          type: string
          format: uuid
        attemptCount:
          type: integer
          format: int32
        maxAttempts:
          type: integer
          format: int32
        responseStatus:
          type: integer
          format: int32
          description: HTTP status returned by the receiver on the last attempt.
          example: 200
        responseTimeMs:
          type: integer
          format: int64
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
        nextRetryAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties:
            type: object
          description: Exact JSON body that was signed and sent. Returned on single-event
            reads only.
    WebhookEventTypeResponse:
      type: object
      description: One subscribable webhook event type.
      properties:
        object:
          type: string
        value:
          type: string
          description: Canonical value to send in enabledEvents and received in the
            Chari-Event-Type header.
          example: payment.succeeded
        group:
          type: string
          description: Event group, i.e. the part before the dot.
          example: payment
        description:
          type: string
          description: Human readable description.
          example: Payment completed successfully
        emitted:
          type: boolean
          description: Whether this release actually emits the event. Reserved events can
            be subscribed to but are not delivered yet.
          example: true
    PageWebhookEndpointResponse:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpointResponse"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        empty:
          type: boolean
    ClientPaymentMethodResponse:
      type: object
      description: Safe client-owned saved-card view. Provider token and all vault
        material are never returned.
      properties:
        id:
          type: string
          format: uuid
          description: Local reusable payment-method identifier.
        clientId:
          type: string
          format: uuid
          description: Client that owns this payment method.
        maskedPan:
          type: string
          description: Masked PAN only.
          example: "**** **** **** 1111"
        scheme:
          type: string
          example: VISA
        expiryDate:
          type: string
          description: Display expiry returned by the provider.
          example: 12/27
        cardName:
          type: string
          example: Personal Visa
        defaultMethod:
          type: boolean
          description: Whether new subscriptions use this method by default.
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      description: Portal JWT — enter your bearer token
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      description: Your Chari Pay API key. A SANDBOX key (`chari_sk_test_...`) targets
        the sandbox environment; a PRODUCTION key (`chari_sk_live_...`) targets
        live. Never expose it in client-side code.
      name: X-CHARI-PAY-API-KEY
      in: header
