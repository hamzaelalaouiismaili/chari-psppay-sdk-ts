  /api/v1/partner/webhooks/events:
    get:
      tags:
        - Webhooks
      summary: List emitted webhook events
      description: Returns the events emitted for this API key's environment, newest
        first. Filter by endpoint, event type, delivery status or creation
        window. Event types use their dotted value such as payment.succeeded;
        the full catalog is available from GET
        /api/v1/partner/webhooks/event-types. Payloads are omitted here — read a
        single event to get the exact signed body.
      operationId: list_8
      parameters:
        - name: endpointId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            description: Webhook event name used in enabledEvents and the Chari-Event-Type
              delivery header. The public-v1 guide identifies which names are
              currently emitted and which are reserved for future products.
            enum:
              - payment_link.created
              - payment_link.updated
              - payment_link.expired
              - payment_link.cancelled
              - payment.initiated
              - payment.requires_action
              - payment.succeeded
              - payment.failed
              - subscription.payment_succeeded
              - subscription.payment_failed
              - subscription.canceled
              - refund.initiated
              - refund.succeeded
              - refund.failed
              - security.token_reused
              - security.rate_limit_exceeded
              - security.invalid_signature
              - wallet.activated
              - wallet.rejected
              - payout.completed
              - payout.failed
              - submerchant.near_cap
              - wallet.funded
              - wallet.transfer_completed
              - merchant_transfer.completed
              - merchant_transfer.failed
              - topup.pending
              - topup.succeeded
              - topup.failed
              - topup.reversed
              - bill_payment.pending
              - bill_payment.succeeded
              - bill_payment.failed
              - bill_payment.reversed
              - voucher.issued
              - voucher.failed
              - voucher.redeemed
              - voucher.expired
              - savings.deposit_succeeded
              - savings.withdrawal_succeeded
              - savings.instruction_failed
              - savings.goal_reached
              - order.paid
              - cash_collection.deposit.completed
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - sending
              - delivered
              - failed
              - retrying
              - exhausted
              - skipped
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PageWebhookEventResponse"
  /api/v1/partner/webhooks/events/{deliveryId}:
    get:
