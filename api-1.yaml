                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/subscriptions:
    get:
      tags:
        - Subscriptions
      summary: List subscriptions
      description: Returns the caller's subscriptions for the key's environment, as a
        paginated Page.
      operationId: list
      parameters:
        - name: origin
          in: query
          description: Filter by creation origin (API or DASHBOARD).
          required: false
          schema:
            type: string
