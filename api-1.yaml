  /checkout/verify:
    post:
      tags:
        - Checkout (Direct API)
      summary: Verify a checkout session
      description: Opens a payment session for payment using its sessionId and the
        verify key (vk) from the create-session response. Returns the amount,
        currency, branding and capabilities of the session. Verify MUST be
        called before submit; on a single-use session the vk is consumed by the
        first verify and cannot be replayed. No API key — do not send
        X-CHARI-PAY-API-KEY.
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutVerifyRequest"
        required: true
      responses:
        "200":
          description: Session verified and open for payment.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CheckoutSessionView"
        "400":
          description: Missing sessionId or vk (VALIDATION_ERROR).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Invalid or already-consumed verify key (INVALID_TOKEN).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Unknown session (SESSION_NOT_FOUND).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Session already paid or canceled (SESSION_ALREADY_CONSUMED /
            SESSION_NOT_ACTIVE).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "410":
          description: Session expired (SESSION_EXPIRED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: []
  /checkout/submit:
    post:
      tags:
        - Checkout (Direct API)
      summary: Submit card details for a checkout session
      description: "Pays a verified session with a card, server-to-server (no hosted
        page). Preconditions: verify must have been called first; when the
        session was created with keepAlive=true, savePaymentMethodConsent=true
        is required; the Idempotency-Key header is required for a reusable (non
        single-use) session. Returns a terminal status, or PENDING_3DS with a
        redirectionUrl the buyer must open to complete the 3-D Secure challenge
        — afterwards call POST /checkout/return. Callers handling raw card data
        are responsible for their own PCI DSS compliance. No API key — do not
        send X-CHARI-PAY-API-KEY."
      operationId: submit
      parameters:
        - name: Idempotency-Key
          in: header
          description: Required for a reusable session; optional (recommended) for a
            single-use one. Replaying the same key returns the first result.
          required: false
          schema:
            type: string
          example: sub_9f3c2a
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSubmitRequest"
        required: true
      responses:
        "200":
          description: "Submission accepted: terminal status, or PENDING_3DS with the ACS
            redirectionUrl."
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CheckoutSubmitResponse"
        "400":
          description: Failed validation, or a missing/oversized Idempotency-Key on a
            reusable session (VALIDATION_ERROR / INVALID_IDEMPOTENCY_KEY).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Session was not verified first (INVALID_TOKEN).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Unknown session (SESSION_NOT_FOUND).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Session already paid or canceled, or the Idempotency-Key was
            replayed with a different body (SESSION_ALREADY_CONSUMED /
            SESSION_NOT_ACTIVE / IDEMPOTENCY_CONFLICT).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "410":
          description: Session expired (SESSION_EXPIRED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: keepAlive session submitted without savePaymentMethodConsent=true
            (PAYMENT_METHOD_CONSENT_REQUIRED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: []
  /checkout/return:
    post:
      tags:
        - Checkout (Direct API)
      summary: Confirm the 3-D Secure return
      description: Correlates the buyer's return from the 3-D Secure challenge with
        the submitted operation and returns the final status plus the merchant
        accept/decline redirectUrl. Call it after the buyer completes the
        redirectionUrl from submit. No API key.
      operationId: confirmReturn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutReturnRequest"
        required: true
      responses:
        "200":
          description: Operation status resolved.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CheckoutReturnResponse"
        "400":
          description: Missing sessionId or operationId (VALIDATION_ERROR).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Unknown session, or the operation does not belong to it
            (SESSION_NOT_FOUND / OPERATION_NOT_FOUND).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: []
  /v1/wallet/cash-ins:
    post:
      tags:
        - Wallet
      summary: Fund the merchant wallet
      description: Creates a local hosted card-payment link. Card submission funds the
        shared sandbox eSIM or the merchant's real production eSIM through the
        canonical checkout flow. Ledger-only sandbox creates and finalizes a
        canonical cash-in through the durable outbox.
      operationId: cashin
      parameters:
        - name: Idempotency-Key
          in: header
          description: Required retry-safe idempotency key.
          required: true
          schema:
            type: string
          example: cashin_20260731_001
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletCashinRequest"
        required: true
      responses:
        "201":
          description: Wallet cash-in link or ledger funding created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletCashinResponse"
        "400":
          description: Malformed request or failed validation (code = VALIDATION_ERROR /
            MISSING_PARAMETER).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Missing or invalid API key (code = UNAUTHORIZED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Authenticated but the key lacks the required permission, or
            production access is not enabled (code = FORBIDDEN /
            PRODUCTION_ACCESS_DENIED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Syntactically valid but a business rule blocks it (e.g.
            WALLET_NOT_ACTIVE).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Rate limit exceeded (code = RATE_LIMITED). Retry after the
            Retry-After header.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/subscriptions/{reference}/test-auto-pay:
    post:
      tags:
        - Subscriptions
      summary: Force the next automatic payment (sandbox only)
      description: "Test helper available only with a SANDBOX API key. It creates or
        reuses the charge for the currently outstanding period, queues the
        pre-debit e-mail, and immediately executes the saved-token payment with
        its internally decrypted CVV and 3DS disabled. The CVV never appears in
        the request or response. The subscription must be INCOMPLETE, ACTIVE or
        retryable PAST_DUE, autoPay must be enabled, and the first keepAlive +
        3DS checkout must already have attached a saved payment method. On
        success, nextRunDate advances. On failure, it does not advance: an
        initial failure stays INCOMPLETE; a renewal failure becomes PAST_DUE.
        The response contains a safe failure category/code, attempt count,
        retry/cancellation timing and fallbackPayUrl. Hard declines such as an
        expired card require a replacement payment method or manual payment.
        Idempotency-Key is mandatory; replaying it returns the same operation
        without another debit."
      operationId: testAutoPay
      parameters:
        - name: reference
          in: path
          description: Subscription reference.
          required: true
          schema:
            type: string
          example: SUB-A12BC34DE5
        - name: Idempotency-Key
          in: header
          description: Required unique key. Reuse it only to replay this exact test request.
          required: true
          schema:
            type: string
          example: test-cycle-2026-09-01
      responses:
        "200":
          description: Forced sandbox billing period executed.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SubscriptionAutoPayTestResponse"
        "400":
          description: Malformed request or failed validation (code = VALIDATION_ERROR /
            MISSING_PARAMETER).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Missing or invalid API key (code = UNAUTHORIZED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: A production key attempted to use the test endpoint.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The subscription is not ready for auto-pay testing or the
            idempotency key conflicts.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SubscriptionAutoPayTestResponse"
        "422":
          description: Syntactically valid but a business rule blocks it (e.g.
            WALLET_NOT_ACTIVE).
