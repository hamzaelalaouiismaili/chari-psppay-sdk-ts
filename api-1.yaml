openapi: 3.1.0
info:
  title: Chari Pay Public API
  description: "REST API for external partners. Authenticate every
    request     with your API key in the `X-CHARI-PAY-API-KEY` header; the
    environment     (SANDBOX vs PRODUCTION) is determined by the key itself —
    sandbox keys     start with `chari_sk_test_`, production keys with
    `chari_sk_live_`. All money is in     MAD major units, timestamps are
    ISO-8601 UTC, and errors use the     `{ \"error\": { \"code\", \"message\"
    }, \"correlationId\" }` envelope.     Send an optional `Idempotency-Key` on
    any create to make it safely     replayable, and an optional `X-Request-Id`
    for support correlation     (echoed on every response). Register signed
    webhook endpoints under     `/api/v1/partner/webhooks/endpoints`; use an
    explicit event allowlist,     verify the HMAC over the raw body, and
    deduplicate every delivery by     `Chari-Event-Id`. The `/checkout/*`
    endpoints are the exception to API-key     auth: they are session-scoped
    (gated by the session's single-use `vk`) —     never send your API key
    there."
  contact:
    name: Chari Pay Developer Support
    email: support@charipay.ma
  version: 1.0.0
servers:
  - url: https://api-psp.charipay.ma
    description: Sandbox — use a SANDBOX API key
  - url: https://api-psp.charipay.ma
    description: Production — use a PRODUCTION API key
security:
  - apiKey: []
tags:
  - name: Checkout (Direct API)
    description: "Server-to-server checkout for a payment session, usable without
      the hosted payment page. No API key: access is gated by the session's
      sessionId plus the single-use vk returned by POST /v1/payment-sessions.
      Flow: verify → submit → (3-D Secure redirect) → return → poll payment
      status."
  - name: Customer journey analytics
    description: Product, link and checkout attribution timelines.
  - name: Webhook Endpoints
    description: API for managing webhook endpoints
  - name: Checkout Sessions
    description: Server-generated, single-use checkouts tied to an order, each with
      a hosted checkout URL and an expiration.
  - name: Payment Links
    description: Durable, shareable links that collect a fixed amount by card or
      cash-at-agency. Reusable, with optional expiration.
  - name: Refunds
    description: Refund a payment (full or partial) and track refund status.
  - name: Transactions
    description: List, search, export and inspect incoming and outgoing money movements.
  - name: Wallet
    description: Merchant wallet balance, account (RIB), and funding.
  - name: Clients
    description: Reusable customer records (name, e-mail, phone) that subscriptions bill.
  - name: Products
    description: Sellable items in the merchant's hosted storefront.
  - name: Webhooks
    description: >
      Register and manage signed merchant webhook endpoints.


      **Currently emitted events:** `payment.succeeded`, `payment.failed`,

      `subscription.payment_succeeded`, `subscription.payment_failed`,

      `subscription.canceled`, `refund.succeeded`, `refund.failed`,
      `order.paid`,

      `merchant_transfer.completed`, `merchant_transfer.failed`,
      `topup.succeeded`,

      `topup.failed`, `bill_payment.pending`, `bill_payment.succeeded`,

      `bill_payment.failed`, `wallet.activated`, `wallet.rejected`,

      `payout.completed`, and `payout.failed`.


      Other values visible in the `WebhookEventType` enum are reserved and are
      not

      emitted by this release. Use an explicit `enabledEvents` allowlist.


      **Receiver contract:** read the exact raw request bytes; reject stale

      `Chari-Webhook-Timestamp` values; verify `Chari-Webhook-Signature` as
      lowercase

      hex HMAC-SHA256 of `timestamp + "." + rawBody`; route using

      `Chari-Event-Type`; and deduplicate atomically on `Chari-Event-Id` (the
      same

      value as body `WebhookEventId`). Return `2xx` only after the business
      update

      and deduplication record commit. Any non-2xx response is retried and
      events

      can be duplicated or delivered out of order.


      Subscription events echo `ExternalId`, `ClientId`, `PeriodDate`,

      `ChargeReference`, and merchant `metadata`, allowing a partner to
      reconcile

      the exact customer and billing period without card data or provider
      errors.
  - name: Subscriptions
    description: "Recurring billing with initial 3DS payment-method setup, advance
      e-mail notices and provider-token based automatic collection. New records
      are INCOMPLETE until the first payment succeeds and sets activatedAt. A
      failed renewal becomes PAST_DUE: the unpaid period and charge stay open, a
      normalized failure reason and fallback payUrl are sent to the customer and
      merchant webhook, and no later period is opened until recovery."
  - name: Webhooks
    description: Register and manage signed merchant webhook endpoints.
paths:
  /v1/subscriptions/{reference}/payment-method:
    put:
      tags:
        - Subscriptions
      summary: Select a subscription payment method
      description: Switches an auto-pay subscription to one of its client's saved
        payment methods. Only the local payment-method UUID is accepted;
        provider tokens and CVV are never exposed.
      operationId: selectPaymentMethod
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectSubscriptionPaymentMethodRequest"
        required: true
      responses:
        "400":
          description: Malformed request or failed validation (code = VALIDATION_ERROR /
            MISSING_PARAMETER).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Missing or invalid API key (code = UNAUTHORIZED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Authenticated but the key lacks the required permission, or
            production access is not enabled (code = FORBIDDEN /
            PRODUCTION_ACCESS_DENIED).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Syntactically valid but a business rule blocks it (e.g.
            WALLET_NOT_ACTIVE).
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Rate limit exceeded (code = RATE_LIMITED). Retry after the
            Retry-After header.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
