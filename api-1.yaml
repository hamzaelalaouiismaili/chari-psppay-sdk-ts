components:
  schemas:
    SelectSubscriptionPaymentMethodRequest:
      type: object
      properties:
        paymentMethodId:
          type: string
          format: uuid
          description: Client-owned local payment-method UUID.
      required:
        - paymentMethodId
    ApiErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code clients branch on.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable explanation. Never contains stack traces or SQL.
          example: amount must be greater than 0
      required:
        - code
        - message
    ApiErrorResponse:
      type: object
      description: Canonical /v1 error envelope. Every error — validation,
        authentication, authorization, business-rule — uses this shape.
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
          description: The error detail.
        correlationId:
          type: string
          description: Echo of the request X-Request-Id, for support/log correlation.
          example: b0c1e2d3-4f56-7890-abcd-ef0123456789
      required:
        - error
    UpdateClientRequest:
      type: object
      description: Partial-update body for a client. Only the fields present are changed.
      properties:
        name:
          type: string
          description: Client full name. Optional; only applied when present.
          example: Amine Bennani
          maxLength: 255
          minLength: 0
        email:
          type: string
          description: Client email address. Optional; only applied when present.
          example: amine@example.com
          maxLength: 255
          minLength: 0
        phone:
          type: string
          description: Client phone number. Optional; only applied when present.
          example: "+212600000000"
          maxLength: 30
          minLength: 0
    CheckoutVerifyRequest:
      type: object
      description: Opens a payment session with its id and verify key.
      properties:
        sessionId:
          type: string
          description: Session id from the create-session response.
          example: ps_5Kd0Rn
        vk:
          type: string
          description: Verify key (verifyKey) from the create-session response; single-use
            on single-use sessions.
      required:
        - sessionId
        - vk
    Branding:
      type: object
      properties:
        displayName:
          type: string
        logoUrl:
          type: string
        primaryColor:
          type: string
        accentColor:
          type: string
        theme:
          type: string
        locale:
          type: string
        contactPhone:
          type: string
        receiptFooter:
          type: string
    CheckoutSessionView:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
        amount:
          type: number
        currency:
          type: string
        orderId:
          type: string
        keepAlive:
          type: boolean
        frontendTheme:
          type: string
        frontendLogo:
          type: string
        frontendCompanyName:
          type: string
        branding:
          $ref: "#/components/schemas/Branding"
        expiresAt:
          type: string
          format: date-time
        testMode:
          type: boolean
        defaultPaymentMethod:
          type: string
        cashAvailable:
          type: boolean
    Card:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        pan:
          type: string
          description: Full card number (PAN). Never stored unmasked.
        expiryDate:
          type: string
          description: Card expiry, MM/YY.
          example: 09/27
          pattern: ^(0[1-9]|1[0-2])/[0-9]{2}$
        cvv:
          type: string
        cardName:
          type: string
          description: Name as printed on the card.
      required:
        - cvv
        - expiryDate
        - firstName
        - lastName
        - pan
    CheckoutSubmitRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: Session id of an already-verified session.
          example: ps_5Kd0Rn
        card:
          $ref: "#/components/schemas/Card"
        savePaymentMethodConsent:
          type: boolean
          description: Explicit buyer consent to store the payment method; required (true)
            when the session has keepAlive=true, ignored otherwise.
      required:
        - card
        - sessionId
    CheckoutSubmitResponse:
      type: object
      properties:
        operationId:
          type: integer
          format: int64
          description: Payment operation id; echo it to POST /checkout/return after 3-D
            Secure.
        reference:
          type: string
        status:
          type: string
          description: Operation status, e.g. SUCCESS, FAILED or PENDING_3DS.
          example: PENDING_3DS
        redirectionUrl:
          type: string
          description: 3-D Secure challenge URL the buyer must open when status is
            PENDING_3DS; absent on a terminal status.
    CheckoutReturnRequest:
      type: object
      properties:
        sessionId:
          type: string
        operationId:
          type: integer
          format: int64
      required:
        - operationId
        - sessionId
    CheckoutReturnResponse:
      type: object
      properties:
        operationId:
          type: integer
          format: int64
        status:
          type: string
        redirectUrl:
          type: string
    WalletCashinRequest:
      type: object
      description: Amount to fund into the merchant wallet.
      properties:
        amount:
          type: number
          description: Amount to fund in MAD.
          example: 250
          minimum: 0.01
      required:
        - amount
    WalletCashinResponse:
      type: object
      description: Wallet cash-in link or completed ledger funding result.
      properties:
        operationId:
          type: integer
          format: int64
          description: Transaction operation id. Omitted until a hosted-link payer submits
            a card.
          example: 1042
        status:
          type: string
          description: Cash-in status.
          example: SUCCESS
        environment:
          type: string
          description: Environment funded by the request.
          example: SANDBOX
        requestedAmount:
          type: number
          description: Requested amount.
          example: 250
        fundedAmount:
          type: number
          description: Amount already funded. Zero while a funding link is pending.
          example: 250
        balance:
          type: number
          description: Current merchant-isolated sandbox balance. Omitted in production.
          example: 250
        currency:
          type: string
          description: ISO 4217 currency code.
          example: MAD
        paymentUrl:
          type: string
          description: Card-funding URL. Omitted only for an immediate ledger-mode sandbox
            cash-in.
        reference:
          type: string
          description: Local payment-link or sandbox ledger reference.
          example: PL-4A6F01D233
        createdAt:
          type: string
          format: date-time
          description: Transaction creation time.
    SubscriptionAutoPayTestResponse:
      type: object
      description: Sandbox-only result of forcing the next subscription period through
        automatic collection.
      properties:
        subscriptionReference:
          type: string
          description: Subscription that was tested.
          example: SUB-A12BC34DE5
        periodDate:
          type: string
          format: date
          description: Scheduled period consumed early by this test run.
          example: 2026-09-01
        chargeReference:
          type: string
          description: Payment-link charge created for the forced period.
          example: PL-8C4F2A1B90
        operationId:
          type: integer
          format: int64
          description: Resulting payment operation identifier.
          example: 6671
        paymentStatus:
          type: string
          description: "Automatic payment status: PENDING, SUCCESS, FAILED, or PENDING_3DS."
          example: SUCCESS
        chargeStatus:
          type: string
          description: Current charge status after the attempt.
          example: PAID
        subscriptionStatus:
          type: string
          description: Subscription status after the attempt.
          example: PAST_DUE
        fallbackPayUrl:
          type: string
          description: Secure customer-action URL when the automatic attempt did not
            succeed.
          example: https://pay.chari.ma/pay/PL-8C4F2A1B90
        nextRunDate:
          type: string
          format: date
          description: Outstanding period after failure, or next period after success.
          example: 2026-09-01
        failureCategory:
          type: string
          description: Stable normalized failure category; absent after success.
          example: CARD_EXPIRED
        failureCode:
          type: string
          description: Stable machine-readable failure code; absent after success.
          example: CARD_EXPIRED
        failureMessage:
          type: string
          description: Safe developer-facing explanation; absent after success.
        retryable:
          type: boolean
          description: Whether another automatic attempt is allowed for this failure.
        attemptCount:
          type: integer
          format: int32
          description: Consecutive failed attempts for the outstanding period.
          example: 1
        maxAttempts:
          type: integer
          format: int32
          description: Configured total-attempt limit, including the first attempt.
          example: 4
        nextPaymentAttemptAt:
          type: string
          format: date-time
          description: Scheduled retry time; absent for hard failures requiring customer
            action.
        autoCancelAt:
          type: string
          format: date-time
          description: Automatic cancellation deadline while the period remains unpaid.
        preDebitNoticeQueued:
          type: boolean
          description: True when the pre-debit email was accepted before the payment
            attempt.
          example: true
    CreateSubscriptionRequest:
      type: object
      description: Payload to start a recurring subscription for a client.
      properties:
        clientId:
          type: string
          format: uuid
          description: UUID of the client to bill (create it first via /v1/clients).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        amount:
          type: number
          description: Amount to charge each period, in MAD major units.
          example: 99
        description:
          type: string
          description: Description shown on each generated charge.
          example: Gold plan — monthly
          maxLength: 255
          minLength: 0
        frequency:
          type: string
          description: Billing cadence.
          enum:
            - DAILY
            - WEEKLY
            - MONTHLY
            - YEARLY
          example: MONTHLY
        startDate:
          type: string
          format: date
          description: Date of the first billing period (YYYY-MM-DD).
          example: 2026-08-01
        endDate:
          type: string
          format: date
          description: Optional end date; open-ended when omitted.
          example: 2027-08-01
        channels:
          type: array
          description: Channels used to notify the client of each charge.
          example:
            - EMAIL
          items:
            type: string
            enum:
              - EMAIL
              - PUSH
              - SMS
              - WHATSAPP
              - IN_APP
          uniqueItems: true
        externalId:
          type: string
          description: Your subscription identifier, unique per merchant and environment.
            Creating a subscription with an externalId that already exists
            returns the existing subscription. It is echoed as ExternalId in
            every subscription payment webhook for reconciliation.
          example: merchant-sub-8421
          maxLength: 255
          minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Optional merchant-owned reconciliation attributes (maximum 4 KB
            serialized), echoed unchanged as metadata in every subscription
            payment webhook. Use opaque identifiers such as customerId or
            contractId; do not include card data, CVV, credentials, or
            unnecessary personal data.
          example:
            customerId: cus_1001
            plan: gold
        autoPay:
          type: boolean
          description: Save the payment method after the first 3DS payment and
            automatically collect future periods. Defaults to true.
          example: true
        billingTime:
          $ref: "#/components/schemas/LocalTime"
          description: Recurring charge time in Africa/Casablanca.
          example: 09:00
        reminderDaysBefore:
          type: integer
          format: int32
          description: How many days before an automatic debit to e-mail the client (0-30).
          example: 3
          maximum: 30
          minimum: 0
        paymentMethodId:
          type: string
          format: uuid
          description: Optional client-owned payment-method UUID. When omitted, the
            client's default payment method is reused when one exists; otherwise
            the first checkout captures a new method.
      required:
        - amount
        - channels
        - clientId
        - description
        - frequency
        - startDate
    LocalTime:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
    BillingRecovery:
      type: object
      properties:
        category:
          type: string
          enum:
            - CARD_EXPIRED
            - INSUFFICIENT_FUNDS
            - CARD_DECLINED
            - AUTHENTICATION_REQUIRED
            - PAYMENT_METHOD_UNAVAILABLE
            - PROVIDER_TEMPORARILY_UNAVAILABLE
            - UNKNOWN
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        customerAction:
          type: string
        attemptCount:
          type: integer
          format: int32
        pastDueSince:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        nextPaymentAttemptAt:
          type: string
          format: date-time
        autoCancelAt:
          type: string
          format: date-time
    PaymentLinkResponse:
      type: object
      description: Merchant-facing view of a payment link.
      properties:
        reference:
          type: string
          description: Unique payment-link reference.
          example: pl_3ND8xk
        externalId:
          type: string
          description: Merchant-supplied external identifier.
          example: order-1234
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Free-form merchant metadata.
          example:
            cartId: c_987
        origin:
          type: string
          description: How the record was created (API or DASHBOARD).
          enum:
            - API
            - DASHBOARD
          example: API
        status:
          type: string
          description: Current lifecycle status of the payment link.
          example: ACTIVE
        amount:
          type: number
          description: Amount to collect.
          example: 149.9
        currency:
          type: string
          description: ISO 4217 currency code.
          example: MAD
        description:
          type: string
          description: Human-readable description shown to the payer.
          example: "Order #1234"
        singleUse:
          type: boolean
          description: Whether the link can be paid only once.
          example: true
        paymentMethod:
          type: string
          description: Payment method used to collect the funds.
          example: CASH
        cashinCode:
          type: string
          description: Cash-in code the payer presents at the collection point.
          example: CI-482913
        cashinEntity:
          type: string
          description: Cash-in collection entity.
          example: CHARI
        customerName:
          type: string
          description: Customer full name.
          example: Amine Bennani
        customerEmail:
          type: string
          description: Customer email address.
          example: amine@example.com
        customerPhone:
          type: string
          description: Customer phone number.
          example: "+212600000000"
        useCount:
          type: integer
          format: int32
          description: Number of times the link has been paid.
          example: 0
        totalCollected:
          type: number
          description: Total amount collected via this link so far.
          example: 149.9
        expiresAt:
          type: string
          format: date-time
          description: Expiry timestamp of the link.
          example: 2026-07-31T10:15:00Z
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: 2026-07-31T10:15:00Z
        acceptUrl:
          type: string
          description: Redirect URL on successful payment.
          example: https://merchant.example.com/success
        declineUrl:
          type: string
          description: Redirect URL on declined payment.
          example: https://merchant.example.com/cancel
        notificationUrl:
          type: string
          description: Webhook URL notified on payment events.
          example: https://merchant.example.com/webhooks/chari
        payUrl:
          type: string
          description: Public buyer-facing payment page URL.
          example: https://pay.chari.ma/pay/pl_3ND8xk
    SavedPaymentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        maskedPan:
          type: string
        scheme:
          type: string
        expiryDate:
          type: string
        cardName:
          type: string
    SubscriptionResponse:
      type: object
      description: Merchant-facing view of a recurring subscription.
      properties:
        reference:
          type: string
          description: Unique subscription reference.
          example: sub_7Qa1bx
        externalId:
          type: string
          description: Merchant subscription identifier echoed as ExternalId in
            subscription webhooks.
          example: merchant-sub-8421
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Merchant reconciliation attributes echoed unchanged as metadata in
            subscription webhooks.
          example:
            customerId: cus_1001
            plan: gold
        origin:
          type: string
          description: How the record was created (API or DASHBOARD).
          enum:
            - API
            - DASHBOARD
          example: API
        status:
          type: string
          description: Lifecycle status. New subscriptions remain INCOMPLETE until the
            first payment succeeds.
          enum:
            - INCOMPLETE
            - ACTIVE
            - PAST_DUE
            - PAUSED
            - COMPLETED
            - CANCELED
          example: ACTIVE
        activatedAt:
          type: string
          format: date-time
          description: When the first successful payment activated the subscription; null
            while INCOMPLETE.
        amount:
          type: number
          description: Amount billed each cycle.
          example: 149.9
        currency:
          type: string
          description: ISO 4217 currency code.
          example: MAD
        description:
          type: string
          description: Human-readable description shown to the payer.
          example: Monthly membership
        frequency:
          type: string
          description: Billing frequency.
          enum:
            - DAILY
            - WEEKLY
            - MONTHLY
            - YEARLY
          example: MONTHLY
        startDate:
          type: string
          format: date
          description: Date of the first billing cycle.
          example: 2026-08-01
        endDate:
          type: string
          format: date
          description: Date the subscription ends, if bounded.
          example: 2026-08-01
        nextRunDate:
          type: string
          format: date
          description: Date of the next scheduled charge.
          example: 2026-08-01
        billingTime:
          $ref: "#/components/schemas/LocalTime"
          description: Recurring charge time in Africa/Casablanca.
          example: 09:00
        autoPayEnabled:
          type: boolean
          description: Whether provider-token based automatic collection is enabled.
        paymentMethod:
          $ref: "#/components/schemas/SavedPaymentMethod"
          description: Saved payment method safe display data. Never contains a provider
            token, PAN or CVV.
        billingRecovery:
          $ref: "#/components/schemas/BillingRecovery"
          description: Present while automatic collection is past due or retains its
            latest recovery state.
        clientId:
          type: string
          format: uuid
          description: Identifier of the client being billed.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        channels:
          type: array
          description: Delivery channels used to notify the client.
          example:
            - EMAIL
          items:
            type: string
            enum:
              - EMAIL
              - PUSH
              - SMS
              - WHATSAPP
              - IN_APP
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: 2026-07-31T10:15:00Z
        currentCharge:
          $ref: "#/components/schemas/PaymentLinkResponse"
          description: Open charge for the current billing period, carrying the
            buyer-facing payUrl; null when no cycle is open.
    RefundPaymentRequest:
      type: object
